spring:
  application:
    name: security-intelligence-platform
  data:
    mongodb:
      uri: ${MONGODB_URI:}
      database: ${MONGODB_DATABASE:securityintel}
      auto-index-creation: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    time-zone: Asia/Kolkata
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /api

# Security Integration Configuration
scan:
  ingestion:
    token: ${SCAN_INGESTION_TOKEN:}
  freshness:
    production:
      hours: ${SCAN_FRESHNESS_PRODUCTION_HOURS:24}
    development:
      hours: ${SCAN_FRESHNESS_DEVELOPMENT_HOURS:168}

# Gemini AI Configuration
gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: gemini-3.6-flash
    endpoint: https://generativelanguage.googleapis.com/v1beta/interactions

logging:
  level:
    com.securityintel: DEBUG
    org.springframework.data.mongodb: DEBUG

mail:
  enabled: ${MAIL_ENABLED:false}
  from: ${MAIL_FROM:security-platform@localhost}