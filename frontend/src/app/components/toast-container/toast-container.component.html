<div class="toast-container" *ngIf="(toasts$ | async) as toasts">
  <div
    *ngFor="let toast of toasts"
    class="toast-item toast-{{ toast.type }}"
    role="alert"
  >
    <span class="toast-icon">
      <span *ngIf="toast.type === 'success'">✅</span>
      <span *ngIf="toast.type === 'error'">🚨</span>
      <span *ngIf="toast.type === 'warning'">⚠️</span>
      <span *ngIf="toast.type === 'info'">ℹ️</span>
    </span>
    <div class="toast-content">
      <div *ngIf="toast.title" class="toast-title">{{ toast.title }}</div>
      <div class="toast-message">{{ toast.message }}</div>
    </div>
    <button class="toast-close" (click)="dismiss(toast.id)" aria-label="Dismiss">✕</button>
  </div>
</div>
