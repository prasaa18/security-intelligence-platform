name: Deploy Security Intelligence Platform

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  SPRING_PROFILES_ACTIVE: prod
  MONGODB_URI: ${{ secrets.MONGODB_URI }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  build-and-test:
    name: Build & Test Backend and Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 20 JDK
        uses: actions/setup-java@v4
        with:
          java-version: '20'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Backend Build & Test
      - name: Build & Test Backend
        working-directory: backend
        run: mvn clean package -DskipTests=false

      # Frontend Build
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular Frontend
        working-directory: frontend
        run: npm run build -- --configuration production

      - name: Archive Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-platform-artifacts
          path: |
            backend/target/*.jar
            frontend/dist/frontend/browser

  deploy:
    name: Deploy to Cloud
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: security-platform-artifacts

      # Optional Docker container build and push
      # - name: Log in to Container Registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deployment Summary
        run: |
          echo "========================================================"
          echo " Security Intelligence Platform Built Successfully!"
          echo " Backend Jar: backend/target/security-intelligence-platform-0.0.1-SNAPSHOT.jar"
          echo " Frontend Dist: frontend/dist/frontend"
          echo "========================================================"
          echo "Use your deployment URL in your microservices DevSecOps pipelines."

