name: Platform Security Scan & Ingest

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: platform-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: security-intelligence-backend
            path: backend
          - service: security-intelligence-frontend
            path: frontend
          - service: demo-auth-service
            path: demo-services/auth-service
          - service: demo-order-service
            path: demo-services/order-service
          - service: demo-payment-service
            path: demo-services/payment-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ matrix.path }}
          format: json
          output: trivy-report.json
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false

      - name: Upload scan to Security Intelligence Platform
        env:
          PLATFORM_URL: ${{ secrets.SECURITY_INTEL_API_URL }}
          INGESTION_TOKEN: ${{ secrets.SCAN_INGESTION_TOKEN }}
          SERVICE_NAME: ${{ matrix.service }}
        run: |
          set -euo pipefail
          platform_url="${PLATFORM_URL%/}"
          platform_url="${platform_url%/api}"

          curl --fail-with-body --silent --show-error \
            -X POST \
            "$platform_url/api/integrations/scans/github-actions" \
            -H "Authorization: Bearer $INGESTION_TOKEN" \
            -F "file=@trivy-report.json" \
            -F "serviceName=$SERVICE_NAME" \
            -F "repository=https://github.com/${{ github.repository }}" \
            -F "branch=${{ github.ref_name }}" \
            -F "commitId=${{ github.sha }}" \
            -F "workflowRunId=${{ github.run_id }}" \
            -F "environment=PRODUCTION"

      - name: Upload Trivy report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 30

  gitleaks:
    name: Gitleaks repository secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: |
            gitleaks-report.json
            results.sarif
          if-no-files-found: warn
          retention-days: 30
